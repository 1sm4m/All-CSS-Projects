<!DOCTYPE html>
	<html>
		<head>
    <meta charset="UTF-8">
    <title>বাংলা বর্ণমালা</title>
    <link rel="stylesheet" href="borno.css">
</head>

<body>

    <h1>বাংলা বর্ণমালা</h1>
    <p>স্বরবর্ণ ও ব্যঞ্জনবর্ণ</p>


    <div class="cont">
        <div class="box one">
            <h2>স্বরবর্ণ</h2>

            <div class="letters">
                <div class="letter">অ</div>
                <div class="letter">আ</div>
                <div class="letter">ই</div>
                <div class="letter">ঈ</div>
                <div class="letter">উ</div>
                <div class="letter">ঊ</div>
                <div class="letter">ঋ</div>
                <div class="letter">এ</div>
                <div class="letter">ঐ</div>
                <div class="letter">ও</div>
                <div class="letter">ঔ</div>
            </div>
        </div>


        
        <div class="box two">
           <h2>ব্যঞ্জনবর্ণ</h2>

            <div class="letters">
                <div class="letter">ক</div>
                <div class="letter">খ</div>
                <div class="letter">গ</div>
                <div class="letter">ঘ</div>
                <div class="letter">ঙ</div>
            </div>
        </div>


      
        <div class="box three">
            

            <div class="letters">
                <div class="letter">চ</div>
                <div class="letter">ছ</div>
                <div class="letter">জ</div>
                <div class="letter">ঝ</div>
                <div class="letter">ঞ</div>
            </div>
        </div>


        <div class="box four">
            

            <div class="letters">
                <div class="letter">ট</div>
                <div class="letter">ঠ</div>
                <div class="letter">ড</div>
                <div class="letter">ঢ</div>
                <div class="letter">ণ</div>
            </div>
        </div>


       
        <div class="box five">
            

            <div class="letters">
                <div class="letter">ত</div>
                <div class="letter">থ</div>
                <div class="letter">দ</div>
                <div class="letter">ধ</div>
                <div class="letter">ন</div>
            </div>
        </div>


        
        <div class="box six">
            

            <div class="letters">
                <div class="letter">প</div>
                <div class="letter">ফ</div>
                <div class="letter">ব</div>
                <div class="letter">ভ</div>
                <div class="letter">ম</div>
            </div>
        </div>


        
        <div class="box seven">
            

            <div class="letters">
                <div class="letter">য</div>
                <div class="letter">র</div>
                <div class="letter">ল</div>
                <div class="letter">ব</div>
            </div>
        </div>


       
        <div class="box eight">
           

            <div class="letters">
                <div class="letter">শ</div>
                <div class="letter">ষ</div>
                <div class="letter">স</div>
                <div class="letter">হ</div>
            </div>
        </div>


     
        <div class="box nine">
           

            <div class="letters">
                <div class="letter">ড়</div>
                <div class="letter">ঢ়</div>
                <div class="letter">য়</div>
                <div class="letter">ৎ</div>
                <div class="letter">ং</div>
                <div class="letter">ঃ</div>
                <div class="letter">ঁ</div>
            </div>
        </div>

    </div>

</body>
</html>
